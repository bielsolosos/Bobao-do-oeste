name: CI - Scraper Service (Python)

on:
  push:
    branches: [ main, develop, master, "feature/**" ]
    paths:
      - 'services/scraper/**'
      - '.github/workflows/ci-scraper.yml'
  pull_request:
    branches: [ main, develop, master ]
    paths:
      - 'services/scraper/**'
      - '.github/workflows/ci-scraper.yml'

concurrency:
  group: scraper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  verify:
    name: Verify (lint + typecheck + tests + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/scraper

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: uv sync --all-extras --dev

      - name: Validar Formatacao e Lint (Ruff)
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Validar Tipagem Estatica (Pyright)
        run: uv run pyright src/ tests/

      - name: Rodar testes e gerar cobertura
        run: |
          mkdir -p target/surefire-reports
          uv run pytest --cov=src --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=target/surefire-reports/junit.xml

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-coverage-report
          path: |
            services/scraper/coverage.xml
            services/scraper/htmlcov/
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-test-reports
          path: services/scraper/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Resumo do verify
        run: |
          {
            echo "## Scraper Service Verify"
            echo "- Formatacao e Lint (Ruff): validado"
            echo "- Tipagem (Pyright): validado"
            echo "- Testes Unitarios e Integracao: concluidos"
            echo "- Cobertura de Codigo: validada"
          } >> "$GITHUB_STEP_SUMMARY"

  build-package:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/scraper

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker (validacao)
        uses: docker/build-push-action@v6
        with:
          context: services/scraper
          file: services/scraper/Dockerfile
          push: false
          tags: scraper-service:ci-test

      - name: Resumo do build
        run: |
          {
            echo "## Scraper Docker Build"
            echo "- Docker Build: concluido com sucesso"
          } >> "$GITHUB_STEP_SUMMARY"
