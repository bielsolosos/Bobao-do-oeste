version: "3.8"

services:
  # Banco de Dados Principal para o Backend Java (BI / Analytics)
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace_bi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scraper Service (Python FastAPI + Playwright + curl_cffi)
  # Roda localmente no Raspberry Pi ou em dev local
  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    container_name: marketplace_scraper
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: "Marketplace Scraper Service"
      APP_ENV: "development"
      PORT: "8001"
      HOST: "0.0.0.0"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/scraper.db"
      BASIC_AUTH_USERNAME: "admin"
      BASIC_AUTH_PASSWORD: "admin"
      SCRAPE_WORKER_CONCURRENCY: "1"
    labels:
      com.bielsolosos.observability.logs: "true"
      com.bielsolosos.observability.application: "projeto-scrap"
      com.bielsolosos.observability.service: "scraper"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./services/scraper/data:/app/data

