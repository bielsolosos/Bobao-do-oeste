version: "3.8"

services:
  # Banco de Dados Principal para o Backend Java (BI / Analytics)
  postgres:
    image: postgres:16-alpine
    container_name: marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketplace_bi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scraper Service (Python FastAPI + Playwright + curl_cffi)
  # Roda localmente no Raspberry Pi ou em dev local
  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    container_name: marketplace_scraper
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: "Marketplace Scraper Service"
      APP_ENV: "development"
      PORT: "8001"
      HOST: "0.0.0.0"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/scraper.db"
      BASIC_AUTH_USERNAME: "admin"
      BASIC_AUTH_PASSWORD: "admin"
      SCRAPE_WORKER_CONCURRENCY: "1"
    labels:
      com.bielsolosos.observability.logs: "true"
      com.bielsolosos.observability.application: "projeto-scrap"
      com.bielsolosos.observability.service: "scraper"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./services/scraper/data:/app/data

  # BI Engine Service (Java / Spring Boot)
  # bi-engine:
  #   build:
  #     context: ./services/bi-engine
  #     dockerfile: Dockerfile
  #   container_name: marketplace_bi_engine
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DB_URL: "jdbc:postgresql://postgres:5432/marketplace_bi"
  #     DB_USERNAME: "postgres"
  #     DB_PASSWORD: "postgrespassword"
  #     PORT: "8080"
  #     GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  #     GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
  #     DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
  #     DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
  #     SCRAPER_BASE_URL: "http://scraper:8001"
  #     SCRAPER_USERNAME: "admin"
  #     SCRAPER_PASSWORD: "admin"
  #     SCRAPER_WEBHOOK_URL: "http://bi-engine:8080/api/v1/webhooks/scraper"
  #     CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:4200"
