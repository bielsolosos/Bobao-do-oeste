spring:
  threads:
    virtual:
      enabled: true
  application:
    name: bi-scraper
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/marketplace_bi}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgrespassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:teste@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:quase consegui vazar esse negosio aqui}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:AIzaSyBnjz8fLgcPeOOexLPVIfXU8w5HiQaqB7Q} #Já rotacionei essa chave. Obrigado 🤪🤪🤪
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}

biscraper:
  app-url: ${APP_FRONTEND_URL:https://bi.bielsolosos.dev.br}
  auth:
    otp:
      enabled: ${AUTH_EMAIL_OTP_ENABLED:false}
      expiration-minutes: ${AUTH_EMAIL_OTP_EXPIRATION_MINUTES:10}
      max-attempts: ${AUTH_EMAIL_OTP_MAX_ATTEMPTS:5}
      cooldown-seconds: ${AUTH_EMAIL_OTP_COOLDOWN_SECONDS:60}
    invites:
      enabled: ${AUTH_INVITES_ENABLED:true}
      expiration-hours: ${AUTH_INVITES_EXPIRATION_HOURS:48}
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1kZWZhdWx0LXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yNTYtYml0cw==}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8081,http://100.86.218.8:4200,http://king-dedede:4200,https://king-dedede.tail3f23df.ts.net,https://bi.bielsolosos.dev.br}
  scraper:
    base-url: ${SCRAPER_BASE_URL:http://localhost:8001}
    username: ${SCRAPER_USERNAME:admin}
    password: ${SCRAPER_PASSWORD:admin}
    webhook-url: ${SCRAPER_WEBHOOK_URL:http://localhost:8080/api/v1/webhooks/scraper}
  email:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    from: ${EMAIL_FROM:BI Scraper <fatiarapidaautomation@gmail.com>}
    digest:
      cron: ${EMAIL_DIGEST_CRON:0 0 8,12,16,20 * * *}
      window-hours: ${EMAIL_DIGEST_WINDOW_HOURS:4}
      max-items: ${EMAIL_DIGEST_MAX_ITEMS:4}

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_FORMAT:logstash}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:default}

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
