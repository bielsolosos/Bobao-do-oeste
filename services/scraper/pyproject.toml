[project]
name = "teste-scrap"
version = "0.1.0"
description = "Stateless Marketplace Scraper Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "curl-cffi>=0.16.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "prometheus-client>=0.23.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=3.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "selectolax>=0.4.11",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
