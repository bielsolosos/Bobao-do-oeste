<div
  class="mt-4 flex flex-col gap-3 border-t border-brand-950/10 bg-surface px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6"
>
  <div class="flex items-center justify-between gap-3 sm:justify-start">
    <p class="text-sm text-brand-950/70">
      Página
      <span class="font-semibold text-brand-950">{{
        totalElements > 0 ? currentPage + 1 : 0
      }}</span>
      de
      <span class="font-semibold text-brand-950">{{ totalPages }}</span>
      <span class="hidden sm:inline"> ({{ totalElements }} resultados)</span>
    </p>

    <div class="flex items-center gap-2">
      <label for="pageSize" class="text-sm text-brand-950/60">Linhas:</label>
      <select
        id="pageSize"
        (change)="onSelectPageSize($event)"
        class="rounded-lg border border-brand-950/20 bg-surface py-1.5 pl-2 pr-8 text-sm text-brand-950 focus:outline-none focus:ring-2 focus:ring-brand-amber-strong"
      >
        @for (size of pageSizeOptions; track size) {
          <option [value]="size" [selected]="size == pageSize">{{ size }}</option>
        }
      </select>
    </div>
  </div>

  <nav class="flex items-center justify-between gap-1 sm:justify-end" aria-label="Paginação">
    <button
      type="button"
      (click)="prevPage()"
      [disabled]="isFirstPage"
      class="inline-flex items-center gap-1 rounded-lg border border-brand-950/15 px-3 py-2 text-sm font-medium text-brand-950/70 transition-colors hover:bg-brand-950/5 disabled:cursor-not-allowed disabled:opacity-40"
    >
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
          clip-rule="evenodd"
        />
      </svg>
      <span class="hidden sm:inline">Anterior</span>
    </button>

    <div class="hidden items-center gap-1 sm:flex">
      @for (page of visiblePages; track $index) {
        @if (page === '...') {
          <span class="px-2 py-2 text-sm text-brand-950/40">...</span>
        } @else {
          <button
            type="button"
            (click)="onPageClick(page)"
            [attr.aria-current]="page === currentPage ? 'page' : null"
            [attr.aria-label]="'Ir para página ' + (page + 1)"
            [class]="
              page === currentPage
                ? 'bg-brand-amber-strong text-brand-950'
                : 'text-brand-950/70 hover:bg-brand-950/5'
            "
            class="min-w-9 rounded-lg px-3 py-2 text-sm font-semibold transition-colors"
          >
            {{ page + 1 }}
          </button>
        }
      }
    </div>

    <button
      type="button"
      (click)="nextPage()"
      [disabled]="isLastPage"
      class="inline-flex items-center gap-1 rounded-lg border border-brand-950/15 px-3 py-2 text-sm font-medium text-brand-950/70 transition-colors hover:bg-brand-950/5 disabled:cursor-not-allowed disabled:opacity-40"
    >
      <span class="hidden sm:inline">Próxima</span>
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </nav>
</div>
